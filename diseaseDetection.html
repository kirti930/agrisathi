<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriSathi - Plant Disease Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .disease-detect-container {
      background: #fff;
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 90%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .disease-detect-container:hover {
      transform: translateY(-5px);
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #2e7d32;
      font-size: 1.5rem;
    }

    .upload-section {
      margin-bottom: 1.25rem;
    }

    .upload-label {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background: #2e7d32;
      color: white;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .upload-label:hover {
      background: #1b5e20;
    }

    input[type="file"] {
      display: none;
    }

    #preview {
      margin-top: 1rem;
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      display: none;
    }

    #preview:hover {
      transform: scale(1.05);
    }

    #detect-btn {
      padding: 0.75rem 1.5rem;
      background: #ffa000;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      margin-bottom: 1.25rem;
    }

    #detect-btn:hover:not(:disabled) {
      background: #ff6f00;
      transform: scale(1.05);
    }

    #detect-btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #2e7d32;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 1rem auto;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-card {
      background: #e8f5e9;
      border-left: 5px solid #2e7d32;
      padding: 1.25rem;
      border-radius: 15px;
      text-align: left;
      animation: fadeIn 0.5s ease;
      display: none;
    }

    .result-card h3 {
      margin-top: 0;
      color: #1b5e20;
      font-size: 1.2rem;
    }

    .result-card p {
      margin: 0.5rem 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .disease-detect-container { padding: 1rem; }
      h2 { font-size: 1.25rem; }
      .upload-label, #detect-btn { font-size: 0.9rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="disease-detect-container">
    <h2>🌿 Plant Disease Detection</h2>

    <div class="upload-section">
      <label class="upload-label" for="plant-image">
        📷 Upload Plant Image
        <input type="file" id="plant-image" accept="image/jpeg,image/png" aria-label="Upload plant image">
      </label>
      <img id="preview" src="" alt="Uploaded plant image preview" role="img">
    </div>

    <button id="detect-btn" disabled>Detect Disease</button>

    <div id="loader" class="loader"></div>
    <div id="result" class="result-card" role="region" aria-live="polite"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const preview = document.getElementById('preview');
      const input = document.getElementById('plant-image');
      const detectBtn = document.getElementById('detect-btn');
      const loader = document.getElementById('loader');
      const result = document.getElementById('result');

      let base64Image = "";

      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (!file.type.match('image/(jpeg|png)')) {
            alert('Please upload a JPEG or PNG image.');
            input.value = '';
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            alert('File size exceeds 5MB. Please upload a smaller image.');
            input.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            base64Image = reader.result.split(',')[1];
            preview.src = reader.result;
            preview.alt = `Preview of uploaded plant image: ${file.name}`;
            preview.style.display = 'block';
            detectBtn.disabled = false;
          };
          reader.onerror = () => {
            alert('Error reading the image file.');
            input.value = '';
          };
          reader.readAsDataURL(file);
        }
      });

      detectBtn.addEventListener('click', async () => {
        if (!base64Image) {
          alert('Please upload an image first!');
          return;
        }

        loader.style.display = 'block';
        result.style.display = 'none';
        result.innerHTML = '';
        detectBtn.disabled = true;

        try {
          
          const response = await fetch('https://crop.kindwise.com/api/v1/identification', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Api-Key': 'lGyVNXhqvdJH2mbFxOpsJAdk790o0aZss3PbAFdVfXxQRtFfjw' // 🔐 Replace with your actual API key

            },
           body: JSON.stringify({
  images: [base64Image],
  similar_images: true,
  datetime: new Date().toISOString().slice(0, 16)
})

          });

          const text = await response.text();
          console.log("Raw response:", text);

          if (!response.ok) {
            throw new Error("HTTP error Status: " + response.status);
          }

          const data = JSON.parse(text);
          const suggestions = data?.result?.disease?.suggestions;

         if (suggestions && suggestions.length > 0) {
  const disease = suggestions[0];
  const minConfidence = 0.65;  // 65% threshold

  if (disease.probability < minConfidence) {
    result.innerHTML = '<p>✅ No disease detected. !!!</p>';
  } else {
    result.innerHTML = `
      <h3>🌱 ${disease.name || 'Unknown Disease'}</h3>
      <p><strong>Scientific Name:</strong> ${disease.scientific_name || 'N/A'}</p>
      <p><strong>Probability:</strong> ${(disease.probability * 100).toFixed(2)}%</p>
      <p><strong>Description:</strong> ${disease.description || 'No description available.'}</p>
      <p><strong>Symptoms:</strong> ${disease.symptoms?.description || 'Not provided'}</p>
      <p><strong>Treatment:</strong> ${disease.treatment?.chemical || 'No chemical treatment listed.'}</p>
    `;
  }
} else {
  result.innerHTML = '<p>✅ No disease detected !!!</p>';
}
        } catch (error) {
          console.error('Error detecting disease:', error);
          result.innerHTML = `<p>⚠ Error: ${error.message}</p>`;
        } finally {
          loader.style.display = 'none';
          result.style.display = 'block';
          detectBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html
