// 🧠 Update Crop Dropdown Based on Type
function updateCropOptions() {
  const type = document.getElementById("typeSelect").value;
  const cropSelect = document.getElementById("cropSelect");
  cropSelect.innerHTML = "<option value=''>Select Crop</option>";
  document.getElementById("regionSelect").innerHTML = "<option value=''>Select Region</option>";

  Object.keys(cropSchedules).forEach(crop => {
    if (cropSchedules[crop].type === type) {
      const opt = document.createElement("option");
      opt.value = crop;
      opt.textContent = crop.charAt(0).toUpperCase() + crop.slice(1);
      cropSelect.appendChild(opt);
    }
  });
}

// 🌍 Update Region Dropdown Based on Crop
function updateRegionOptions() {
  const crop = document.getElementById("cropSelect").value;
  const regionSelect = document.getElementById("regionSelect");
  regionSelect.innerHTML = "<option value=''>Select Region</option>";

  if (cropSchedules[crop]) {
    Object.keys(cropSchedules[crop].regions).forEach(region => {
      const opt = document.createElement("option");
      opt.value = region;
      opt.textContent = region.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
      regionSelect.appendChild(opt);
    });
  }
}

// 📅 Show Full Schedule
function showFullSchedule() {
  const crop = document.getElementById("cropSelect").value;
  const region = document.getElementById("regionSelect").value;
  const results = document.getElementById("calendar-results");

  if (!crop || !region) {
    results.innerHTML = "<p style='color:red; text-align:center;'>⚠ Please select crop and region.</p>";
    return;
  }

  const regionData = cropSchedules[crop]?.regions?.[region];
  if (!regionData || !regionData.schedule) {
    results.innerHTML = "<p style='color:red; text-align:center;'>⚠ No schedule found for this crop and region.</p>";
    return;
  }

  let html = `<h2 style="color:#2e7d32; text-align:center;">📌 ${crop.charAt(0).toUpperCase() + crop.slice(1)} Schedule for ${region.replace(/([A-Z])/g, ' $1')}</h2>`;
  html += `<p style="text-align:center; color:#555;size:40px;">Climate: ${regionData.climate}</p>`;
  html += "<div style='display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin-top:15px;'>";

  for (const [month, task] of Object.entries(regionData.schedule)) {
    html += `<div style="background:#e8f5e9; padding:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
               <strong>${month}:</strong> <br> ${task}
             </div>`;
  }
  html += "</div>";

  results.innerHTML = html;
}
