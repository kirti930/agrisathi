<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSathi - Weather Alerts</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f0f9f0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 20px;
      margin: 15px auto;
      border-radius: 16px;
      max-width: 420px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    .card:hover {
      transform: scale(1.02);
    }
    .alert {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    button {
      background: linear-gradient(45deg, #4CAF50, #45a049);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background: linear-gradient(45deg, #45a049, #4CAF50);
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 60%;
    }
  </style>
</head>
<body>

  <h2>⛅ Weather Alert Card</h2>

  <div>
    <input type="text" id="cityInput" placeholder="Enter city (optional)">
    <button onclick="getWeatherByCity()">Search</button>
    <button onclick="getWeatherByLocation()">📍 Use My Location</button>
  </div>

  <div id="weather-card"></div>

  <script>
    // Function: Get Weather by City (manual input)
    async function getWeatherByCity() {
      const city = document.getElementById("cityInput").value.trim();
      if (!city) {
        alert("Please enter a city name");
        return;
      }

      try {
        // Get lat/lon using Open-Meteo geocoding API
       const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          alert("City not found");
          return;
        }

        const { latitude, longitude, name, country } = geoData.results[0];
       fetchWeather(latitude, longitude, `${name}, ${country}`);
      } catch (error) {
        console.error("Error fetching city:", error);
        alert("Error finding city");
      }
    }

    // Function: Get Weather by GPS
    function getWeatherByLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchWeather(lat, lon, "Your Location");
          },
          error => {
            alert("Unable to fetch location. Please enter city manually.");
            console.error(error);
          }
        );
      } else {
        alert("Geolocation not supported by your browser");
      }
    }

    // Core Function: Fetch weather data
    async function fetchWeather(lat, lon, placeName) {
      const weatherCard = document.getElementById("weather-card");

      try {
        const response = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation`
        );
        const data = await response.json();

        const weather = data.current_weather;
        const temperature = weather.temperature;
        const wind = weather.windspeed;

        // Rainfall forecast for next 24 hours
        const rainData = data.hourly.precipitation.slice(0, 24);
        const maxRain = Math.max(...rainData);

        // Alerts
        let alertMsg = "✅ Safe weather for farming.";
        if (maxRain > 20) {
          alertMsg = "⚠ Heavy rainfall expected! Take precautions.";
        } else if (wind > 40) {
          alertMsg = "⚠ Strong winds! Protect crops.";
        } else if (temperature > 40) {
          alertMsg = "⚠ Heatwave alert! Ensure irrigation.";
        }

        weatherCard.innerHTML = `
          <div class="card">
            <h3>📍 Location: ${placeName}</h3>
            <p><b>Temperature:</b> ${temperature} °C</p>
            <p><b>Wind Speed:</b> ${wind} km/h</p>
            <p><b>Max Rain (next 24h):</b> ${maxRain} mm</p>
            <p class="alert">${alertMsg}</p>
          </div>
        `;
      } catch (error) {
        weatherCard.innerHTML = `<p style="color:red;">❌ Error fetching weather data</p>`;
        console.error(error);
      }
    }

    // Auto-detect location on page load
    window.onload = getWeatherByLocation;
  </script>

</body>
</html>
