<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop Advice - AgriSathi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 0;
    }

    header {
      background: #2e7d32;
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    .advice-section {
      max-width: 700px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .advice-section h2 {
      margin-bottom: 20px;
      color: #2e7d32;
      font-size: 28px;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 15px 0 5px;
      color: #444;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #2e7d32;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    select:focus,
    input:focus {
      border-color: #66bb6a;
      box-shadow: 0 0 8px rgba(46, 125, 50, 0.4);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1b5e20;
      transform: scale(1.03);
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #e8f5e9;
      border-left: 6px solid #2e7d32;
      border-radius: 8px;
      font-size: 18px;
      display: none;
    }
  </style>
</head>
<body>
  <header>🌱 AgriSathi - Crop Advice</header>

  <section class="advice-section">
    <h2>Get Smart Crop Recommendations</h2>
    <form id="adviceForm">
      <label for="season">🌤 Season</label>
      <select id="season" required>
        <option value="">-- Select Season --</option>
        <option value="summer">Summer</option>
        <option value="monsoon">Monsoon</option>
        <option value="winter">Winter</option>
      </select>

      <label for="state">📍 State</label>
      <select id="state" required>
        <option value="">-- Select State --</option>
        <option value="Rajasthan">Rajasthan</option>
        <option value="Punjab">Punjab</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="UP">Uttar Pradesh</option>
      </select>

      <label for="soil">🌎 Soil Type</label>
      <select id="soil" required>
        <option value="">-- Select Soil --</option>
        <option value="black">Black Soil</option>
        <option value="red">Red Soil</option>
        <option value="alluvial">Alluvial Soil</option>
        <option value="sandy">Sandy Soil</option>
      </select>

      <label for="water">💧 Water Availability</label>
      <select id="water" required>
        <option value="">-- Select Availability --</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <label for="budget">💰 Budget Level</label>
      <select id="budget" required>
        <option value="">-- Select Budget --</option>
        <option value="low">Low Budget</option>
        <option value="medium">Medium Budget</option>
        <option value="high">High Budget</option>
      </select>

      <label for="organic">🌿 Prefer Organic Farming?</label>
      <select id="organic" required>
        <option value="">-- Select Option --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <button type="submit">Get Advice</button>
    </form>

    <div id="result"></div>
<button id="toCalendar" style="margin-top:16px;background:#ffa000;color:#fff;border-radius:10px;border:none;padding:14px 0;font-size:18px;cursor:pointer;transition:0.3s;">
  📅 View Crop Calendar
</button>
  </section>

  <script>
    async function getExternalAdvice(state, season, soil, water, organic) {
      const apiKey = "YOUR_AGRIO_API_KEY";
      const url = `https://api.agrio.app/advisory?state=${state}&season=${season}&soil=${soil}&water=${water}`;

      try {
        const res = await fetch(url, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          }
        });
        if (res.ok) {
          const json = await res.json();
          return json.recommendedCrops;
        } else {
          throw new Error("API not OK");
        }
      } catch (error) {
        console.log("API error, using local data:", error);
        return null;
      }
    }

    document.getElementById("adviceForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const season = document.getElementById("season").value;
      const state = document.getElementById("state").value;
      const soil = document.getElementById("soil").value;
      const water = document.getElementById("water").value;
      const budget = document.getElementById("budget").value;
      const organic = document.getElementById("organic").value;

      let advice = "<h3>✅ Based on Inputs:</h3>";

      const external = await getExternalAdvice(state, season, soil, water, organic);
      if (external && external.length > 0) {
        advice += `<p>Suggested (via API): ${external.join(", ")}</p>`;
      } else {
        const local = {
          "Rajasthan": {
            "monsoon": ["Bajra", "Moong", "Groundnut"],
            "winter": ["Wheat", "Barley"]
          },
          "Maharashtra": {
            "monsoon": ["Bajra", "Moong", "Groundnut"],
            "winter": ["Wheat", "Barley"]
          },
          "UP": {
            "monsoon": ["Bajra", "Moong", "Groundnut"],
            "winter": ["Wheat", "Barley"]
          },
          "Punjab": {
            "monsoon": ["Paddy", "Maize"],
            "winter": ["Wheat", "Mustard"]
          }
        };
        if (local[state] && local[state][season]) {
          advice += `<p>Suggested (local): ${local[state][season].join(", ")}</p>`;
        } else {
          advice += "<p>No suggestion found. Try adjusting soil, water or season.</p>";
        }
      }

      if (organic === "yes") {
        advice += "<p>🌿 You prefer organic farming, consider using organic fertilizers and biopesticides.</p>";
      }

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = advice;

      document.getElementById("toCalendar").addEventListener("click", function () {
  // Change the path below to your crop calendar file or route
  window.location.href = "cropCalender.html";
});
    });
  </script>
</body>
</html>
